name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: macos-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@latest \
            @semantic-release/changelog@latest \
            @semantic-release/git@latest \
            @semantic-release/github@latest \
            conventional-changelog-conventionalcommits@latest

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          npx semantic-release --dry-run > /tmp/semantic-output.txt || true
          cat /tmp/semantic-output.txt

          # Check if there's a new version
          if grep -q "Published release" /tmp/semantic-output.txt || grep -q "The next release version is" /tmp/semantic-output.txt; then
            echo "NEW_RELEASE=true" >> $GITHUB_OUTPUT
            VERSION=$(grep "The next release version is" /tmp/semantic-output.txt | sed 's/.*version is //' || echo "")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            # Actually run the release
            npx semantic-release
          else
            echo "NEW_RELEASE=false" >> $GITHUB_OUTPUT
            echo "No new release needed"
          fi

      - name: Install dependencies
        if: steps.semantic.outputs.NEW_RELEASE == 'true'
        run: swift package resolve

      - name: Build universal binary
        if: steps.semantic.outputs.NEW_RELEASE == 'true'
        run: |
          echo "Building for arm64..."
          swift build -c release --arch arm64

          echo "Building for x86_64..."
          swift build -c release --arch x86_64

          echo "Creating universal binary..."
          mkdir -p .build/universal
          lipo -create \
            .build/arm64-apple-macosx/release/MacRunner \
            .build/x86_64-apple-macosx/release/MacRunner \
            -output .build/universal/MacRunner

      - name: Create app bundle
        if: steps.semantic.outputs.NEW_RELEASE == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.VERSION }}"

          mkdir -p build/MacRunner.app/Contents/MacOS
          mkdir -p build/MacRunner.app/Contents/Resources

          cp .build/universal/MacRunner build/MacRunner.app/Contents/MacOS/
          chmod +x build/MacRunner.app/Contents/MacOS/MacRunner

          cat > build/MacRunner.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MacRunner</string>
              <key>CFBundleIdentifier</key>
              <string>com.omniaura.mac-runner</string>
              <key>CFBundleName</key>
              <string>Mac Runner</string>
              <key>CFBundleDisplayName</key>
              <string>Mac Runner</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSHumanReadableCopyright</key>
              <string>Copyright © 2026 Omni Aura. MIT License.</string>
          </dict>
          </plist>
          EOF

      - name: Create ZIP and DMG
        if: steps.semantic.outputs.NEW_RELEASE == 'true'
        id: artifacts
        run: |
          VERSION="${{ steps.semantic.outputs.VERSION }}"

          # Create ZIP
          cd build
          zip -r "MacRunner-${VERSION}.zip" MacRunner.app
          SHA256=$(shasum -a 256 "MacRunner-${VERSION}.zip" | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
          cd ..

          # Create DMG
          brew install create-dmg
          create-dmg \
            --volname "Mac Runner" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MacRunner.app" 175 120 \
            --hide-extension "MacRunner.app" \
            --app-drop-link 425 120 \
            "build/MacRunner-${VERSION}.dmg" \
            "build/MacRunner.app" || \
          hdiutil create \
            -volname "Mac Runner" \
            -srcfolder build/MacRunner.app \
            -ov -format UDZO \
            "build/MacRunner-${VERSION}.dmg"

      - name: Upload artifacts to release
        if: steps.semantic.outputs.NEW_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.semantic.outputs.VERSION }}"

          gh release upload "v${VERSION}" \
            "build/MacRunner-${VERSION}.zip" \
            "build/MacRunner-${VERSION}.dmg" \
            --clobber

      - name: Update Homebrew cask
        if: steps.semantic.outputs.NEW_RELEASE == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.VERSION }}"
          SHA256="${{ steps.artifacts.outputs.SHA256 }}"

          cat > Casks/mac-runner.rb << EOF
          cask "mac-runner" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/omniaura/mac-runner/releases/download/v#{version}/MacRunner-#{version}.zip"
            name "Mac Runner"
            desc "Menu bar app for managing GitHub Actions self-hosted runners"
            homepage "https://github.com/omniaura/mac-runner"

            depends_on macos: ">= :ventura"

            app "MacRunner.app"

            zap trash: [
              "~/Library/Application Support/MacRunner",
              "~/Library/Preferences/com.omniaura.mac-runner.plist",
            ]

            caveats <<~EOS
              Mac Runner has been installed! To use:

              1. Launch from Applications or run: open -a "Mac Runner"
              2. Click the runner icon in menu bar
              3. Add your GitHub repos with PAT token
              4. Runners will be automatically configured!

              For help: https://github.com/omniaura/mac-runner
            EOS
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mac-runner.rb
          git commit -m "chore: update cask SHA256 for v${VERSION} [skip ci]"
          git push
