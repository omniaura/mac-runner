name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.runner.outputs.use-runner }}
    steps:
      - name: Select runner
        id: runner
        uses: mikehardy/runner-fallback-action@v1
        with:
          primary-runner: mac-runner
          fallback-runner: macos-latest
          fallback-on-error: true
          github-token: ${{ secrets.RUNNER_TOKEN }}

  build-and-test:
    name: Build & Test
    needs: select-runner
    runs-on: ${{ fromJson(needs.select-runner.outputs.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Reset SwiftPM state
        run: |
          rm -rf .build
          rm -f Package.resolved
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/.swiftpm/cache
          swift package reset

      - name: Resolve dependencies
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          swift package resolve

      - name: Build
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          swift build --disable-sandbox

      - name: Test
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          swift test --disable-sandbox
